name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Secret scan (full tree)
        run: npm run scan:secrets

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Unit & integration tests
        run: npm run test

      - name: Production build
        env:
          CI: 'true'
          NEXT_TELEMETRY_DISABLED: '1'
          # Public client config only — required at build time (see src/lib/firebase.ts).
          # Real values live in Vercel/Firebase deploy secrets, not in CI.
          NEXT_PUBLIC_APP_URL: https://3arida.org
          NEXT_PUBLIC_APP_NAME: 3arida
          NEXT_PUBLIC_FIREBASE_API_KEY: ci-build-placeholder
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: arida-c5faf.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: arida-c5faf
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: arida-c5faf.firebasestorage.app
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
          NEXT_PUBLIC_FIREBASE_APP_ID: '1:000000000000:web:ci-build-placeholder'
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_ci_build_placeholder
        run: npm run build
